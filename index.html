<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Youtube playlist length calculator">
    <title>YouTube Playlist Length Calculator</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <style>
        *,
        ::after,
        ::before {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
        }

        header {
            width: -webkit-fill-available;
            padding: 20px 5vw;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0px 2px 25px rgba(0, 0, 0, 0.1);

            svg {
                height: 30px;
            }

            span {
                font-size: 20px;
                font-weight: 600;
            }
        }


        main {
            width: -webkit-fill-available;
            position: relative;
            display: flex;
            gap: 24px;
            flex-direction: column;
            margin: 20px 5vw;
            padding: 60px 0;

            form {
                width: 100%;
                display: flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;

                div:first-child {
                    display: flex;
                    align-items: center;
                    border: 1px solid black;
                    border-radius: 50px;
                    height: 45px;
                    width: 400px;

                    input {
                        width: -webkit-fill-available;
                        height: 43px;
                        padding: 10px;
                        border: 0;
                        outline: 0;
                        font-size: 16px;
                        border-radius: 50px 0 0 50px;
                        border-right: 1px solid black;
                    }

                    svg {
                        min-width: 24px;
                        min-height: 24px;
                        margin: 10px;
                        cursor: pointer;
                    }
                }

                >svg {
                    display: none;
                    width: 50px;
                    height: 45px;
                }

            }

        }

        .adv-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            padding: 5px;

            input[type="number"] {
                width: 200px;
                height: 35px;
                border-radius: 50px;
                border: 1px solid rgba(0, 0, 0, 0.2);
                padding: 5px 10px;
                outline: none;
            }

            .close {
                width: 25px;
                height: 25px;
                cursor: pointer;
            }
        }

        .adv-button {
            border: 0;
            outline: 0;
            color: #065fd4;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            background: transparent;
        }

        main .result {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        footer {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100vw;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0px 2px 25px rgba(0, 0, 0, 0.1);
        }

        .toast {
            width: max-content;
            display: flex;
            gap: 12px;
            align-items: center;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, 0);
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-style: normal;
            font-weight: 500;
            line-height: 20px;
            margin: auto;
            background: var(--Accent-Light-Red-2, #FBE9E5);
            color: var(--Accent-Dark-Red-1, #A31B00);

            svg {
                min-width: 16px;
            }
        }
    </style>
</head>

<body>

        <span>Playlist Length Calculator</span>
    </header>

    <main>
        <div class="toast" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M7.99985 0.615356C3.93831 0.615356 0.615234 3.93843 0.615234 7.99997C0.615234 12.0615 3.93831 15.3846 7.99985 15.3846C12.0614 15.3846 15.3845 12.0615 15.3845 7.99997C15.3845 3.93843 12.0614 0.615356 7.99985 0.615356ZM2.46141 7.99995C2.46141 4.95379 4.95372 2.46148 7.99987 2.46148C9.19987 2.46148 10.3076 2.83071 11.1999 3.47687L3.4768 11.1999C2.83064 10.3076 2.46141 9.19995 2.46141 7.99995ZM7.99973 13.5385C6.79973 13.5385 5.69204 13.1692 4.79973 12.5231L12.5228 4.8C13.169 5.69231 13.5382 6.8 13.5382 8C13.5382 11.0462 11.0459 13.5385 7.99973 13.5385Z"
                    fill="#A31B00" />
            </svg>
            <span>Something went wrong. Please try again.</span>
        </div>
        <form class="search-form">
            <div>
                <input type="search" id="playlistId" placeholder="Enter youtube playlist link" required />
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" height="24" viewBox="0 0 24 24" width="24"
                    focusable="false" aria-hidden="true">
                    <path clip-rule="evenodd"
                        d="M16.296 16.996a8 8 0 11.707-.708l3.909 3.91-.707.707-3.909-3.909zM18 11a7 7 0 00-14 0 7 7 0 1014 0z"
                        fill-rule="evenodd"></path>
                </svg>
            </div>
            <div class="adv-form" style="display: none">
                <input type="number" name="start" id="start" min="1" max="9999" placeholder="Enter start video number"
                    required />
                <input type="number" name="end" id="end" min="1" max="9999" placeholder="Enter end video number"
                    required />
                <span class="close">&#10005;</span>
            </div>
            <button class="adv-button">Advanced search</button>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
                <rect fill="#000000" stroke="#000000" stroke-width="5" width="30" height="30" x="25" y="50">
                    <animate attributeName="y" calcMode="spline" dur="2" values="50;120;50;"
                        keySplines=".5 0 .5 1;.5 0 .5 1" repeatCount="indefinite" begin="-.4"></animate>
                </rect>
                <rect fill="#000000" stroke="#000000" stroke-width="5" width="30" height="30" x="85" y="50">
                    <animate attributeName="y" calcMode="spline" dur="2" values="50;120;50;"

                </rect>
                <rect fill="#000000" stroke="#000000" stroke-width="5" width="30" height="30" x="145" y="50">
                    <animate attributeName="y" calcMode="spline" dur="2" values="50;120;50;"

            </svg>
        </form>

        <div class="result">
            <div id="videos"></div>
            <div id="result"></div>
        </div>

    <footer></footer>

    <script>
        var showAdvForm = false;
        const API_KEY = "AIzaSyA2-nX53GEYS8ZKwC6VCe-t2iFD7_VqUTE";

        function getId(playlistLink) {
            const pattern = /^([\S]+list=)?([\w_-]+)[\S]*$/;
            const match = playlistLink?.match(pattern);
            return match ? match[2] : "";
        }

        async function calculateTotalLength(playlistId, start, end) {
            let totalDuration = 0;
            let totalAdvDuration = 0;
            let totalVideos = 0;
            let nextPageToken = "";
            let count = 0;

            try {
                do {
                    const response = await fetch(
                        `https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId=${playlistId}&key=${API_KEY}&pageToken=${nextPageToken}`
                    );
                    if (!response.ok) {
                        throw new Error("Invalid playlist");
                    }
                    const data = await response.json();

                    const videoIds = data.items.map((item) => item.contentDetails.videoId);
                    if (videoIds.length) {
                        const videoDetailsResponse = await fetch(
                            `https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoIds.join(",")}&key=${API_KEY}`
                        );
                        if (!videoDetailsResponse.ok) {
                            throw new Error("Invalid video details");
                        }
                        const videoDetailsData = await videoDetailsResponse.json();

                        videoDetailsData.items.forEach((video) => {
                            const duration = convertDurationToSeconds(video.contentDetails.duration);
                            if (start <= count && count <= end) {
                                totalAdvDuration += duration;
                            }
                            totalDuration += duration;
                            count++;
                        });
                    }

                    nextPageToken = data.nextPageToken;
                    totalVideos += videoIds.length;
                } while (nextPageToken);

                displayTotalDuration(showAdvForm ? totalAdvDuration : totalDuration, showAdvForm ? end - start + 1 : totalVideos);
            } catch (error) {
                displayError();
                document.body.style.pointerEvents = 'unset';
                document.querySelector('.search-form >svg').style.display = 'none';
            }
        }

        function convertDurationToSeconds(duration) {
            const regex = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/;
            const matches = regex.exec(duration);
            return (parseInt(matches[1] || 0) * 3600) + (parseInt(matches[2] || 0) * 60) + parseInt(matches[3] || 0);
        }

        function displayTotalDuration(totalSeconds, totalVideos) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.body.style.pointerEvents = 'unset';
            document.querySelector('.search-form >svg').style.display = 'none';
            document.getElementById("result").innerText = `Total duration: ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
            document.getElementById("videos").innerText = `No. of videos: ${totalVideos}`;
        }

        document.querySelector('.search-form div svg').addEventListener("click", function () {
            console.log('clicked', showAdvForm);
            const playlistId = getId(document.getElementById("playlistId").value);
            const start = parseInt(document.querySelector("#start").value, 10);
            const end = parseInt(document.querySelector("#end").value, 10);

            if (playlistId?.length) {
                if (showAdvForm) {
                    if (start > 0 && end > 0 && start <= end) {
                        resetDisplay();
                        calculateTotalLength(playlistId, start - 1, end - 1);
                    } else {
                        displayError();
                    }
                } else {
                    resetDisplay();
                    calculateTotalLength(playlistId, 0, 0);
                }
            } else {
                displayError();
            }
        });

        function resetDisplay() {
            document.getElementById("result").innerText = '';
            document.getElementById("videos").innerText = '';
            document.body.style.pointerEvents = 'none';
            document.querySelector('.search-form >svg').style.display = 'block';
        }

        function displayError() {
            document.querySelector('.toast').style.display = 'flex';
            setTimeout(() => {
                document.querySelector('.toast').style.display = 'none';
            }, 5000);
        }

        document.querySelector(".adv-button").addEventListener("click", function () {
            document.querySelector(".adv-form").style.display = "flex";
            document.querySelector(".adv-button").style.display = "none";
            showAdvForm = true;
        });

        document.querySelector(".close").addEventListener("click", function () {
            document.querySelector(".adv-form").style.display = "none";
            document.querySelector(".adv-button").style.display = "inline-block";
            showAdvForm = false;
        });

        document.querySelector("footer").innerText = "Arpit Gupta, " + new Date().getFullYear();
    </script>
